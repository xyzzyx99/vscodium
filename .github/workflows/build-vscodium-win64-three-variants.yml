name: Build VSCodium Windows x64 selective GL LTCG variants

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: GL
            msvc_gl: 'yes'
            msvc_ltcg: 'no'
          - variant: LTCG
            msvc_gl: 'no'
            msvc_ltcg: 'yes'
          - variant: GL-LTCG
            msvc_gl: 'yes'
            msvc_ltcg: 'yes'
    runs-on: windows-2025
    timeout-minutes: 360
    env:
      SHOULD_BUILD: 'yes'
      SHOULD_BUILD_REH: 'no'
      SHOULD_BUILD_REH_WEB: 'no'
      CI_BUILD: 'no'
      OS_NAME: windows
      VSCODE_ARCH: x64
      VSCODE_QUALITY: stable
      GYP_MSVS_VERSION: '2022'
      MAX_OLD_SPACE_SIZE: '8192'
      # Global /GL and /LTCG are intentionally disabled.
      CL: "/O2 /arch:AVX2"
      # Rust source-built release targets: AVX2 + fat link-time optimization.
      # Cargo release profile applies only to crates built under that profile.
      RUSTFLAGS: '-C target-feature=+avx2'
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '3'
      CARGO_PROFILE_RELEASE_LTO: 'fat'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'

    steps:
      - name: Check out VSCodium sources
        uses: actions/checkout@v4

      - name: Set up Node.js from VSCodium .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and check tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command jq -ErrorAction SilentlyContinue)) {
            choco install jq -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Failed to install jq' }
          }
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
            throw 'Rust/Cargo is missing from the Windows runner.'
          }
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            throw '7-Zip is missing from the Windows runner.'
          }
          node --version
          npm --version
          python --version
          jq --version
          cargo --version
          git --version

      # First complete upstream preparation with the proven MSVC settings.
      # In particular, do NOT put /GL or /LTCG into the global CL/LINK/_LINK_ variables.
      - name: Retrieve and prepare VS Code with baseline compiler flags
        shell: bash
        run: |
          set -eo pipefail
          unset LINK _CL_ _LINK_
          export CL='/O2 /arch:AVX2'
          source ./get_repo.sh
          source ./version.sh
          source ./prepare_vscode.sh

      # A controlled target-specific experiment: recompile exactly one C++ addon
      # with variant-specific GYP/MSVC settings after npm ci has completed.
      # This is NOT whole-application MSVC LTO. Most native binaries still use
      # upstream settings. It deliberately avoids modifying the Rust CLI link.
      - name: Configure selected native target (@vscode/deviceid)
        shell: pwsh
        env:
          USE_GL: ${{ matrix.msvc_gl }}
          USE_LTCG: ${{ matrix.msvc_ltcg }}
        run: |
          $ErrorActionPreference = 'Stop'
          $file = Join-Path $env:GITHUB_WORKSPACE 'vscode/node_modules/@vscode/deviceid/binding.gyp'
          if (-not (Test-Path $file)) { throw "Expected addon binding.gyp missing: $file" }
          $source = [System.IO.File]::ReadAllText($file)
          if ($env:USE_GL -eq 'yes') {
            $pattern = '"VCCLCompilerTool"\s*:\s*\{'
            if (-not [regex]::IsMatch($source, $pattern)) { throw 'VCCLCompilerTool block not found' }
            $source = ([regex]::new($pattern)).Replace($source, '"VCCLCompilerTool": { "WholeProgramOptimization": "true", ', 1)
          }
          if ($env:USE_LTCG -eq 'yes') {
            $pattern = '"VCLinkerTool"\s*:\s*\{'
            if (-not [regex]::IsMatch($source, $pattern)) { throw 'VCLinkerTool block not found' }
            $source = ([regex]::new($pattern)).Replace($source, '"VCLinkerTool": { "LinkTimeCodeGeneration": "UseLinkTimeCodeGeneration", ', 1)
          }
          [System.IO.File]::WriteAllText($file, $source, [System.Text.UTF8Encoding]::new($false))
          Write-Host "Patched selected native addon for ${{ matrix.variant }}"
          Select-String -Path $file -Pattern 'WholeProgramOptimization|LinkTimeCodeGeneration' | ForEach-Object { Write-Host $_.Line }

      - name: Rebuild selected native addon only
        shell: pwsh
        working-directory: vscode
        run: |
          $ErrorActionPreference = 'Stop'
          # Keep proven AVX2 compiler defaults. Optimizations are in the
          # addon's binding.gyp, never in global /GL or linker environment.
          $env:CL = '/O2 /arch:AVX2'
          Remove-Item Env:LINK -ErrorAction SilentlyContinue
          Remove-Item Env:_LINK_ -ErrorAction SilentlyContinue
          Remove-Item Env:_CL_ -ErrorAction SilentlyContinue
          npm rebuild '@vscode/deviceid' --build-from-source
          if ($LASTEXITCODE -ne 0) { throw 'Targeted deviceid rebuild failed' }

      # Matches upstream build.sh's Windows CI_BUILD=no packaging path,
      # deliberately skipping prepare_vscode.sh a second time. The latter
      # would run npm ci again and erase the targeted native rebuild.
      - name: Package VSCodium from already prepared source
        shell: bash
        run: |
          set -eo pipefail
          unset LINK _CL_ _LINK_
          export CL='/O2 /arch:AVX2'
          export NODE_OPTIONS="--max-old-space-size=${MAX_OLD_SPACE_SIZE}"
          export VSCODE_PUBLISH_COUNTER=1
          cd vscode
          npm run gulp vscode-min-prepack
          source ../build/windows/rtf/make.sh
          source ../build/windows/install_inno_update.sh
          npm run copy-policy-dto --prefix build
          node build/lib/policies/policyGenerator.ts build/lib/policies/policyData.jsonc win32
          npm run gulp "vscode-win32-${VSCODE_ARCH}-min-packing"
          # Rust code-cli builds without any global MSVC linker overrides.
          source ../build_cli.sh

      - name: Locate packaged VSCodium application
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            (Join-Path $env:GITHUB_WORKSPACE '..\VSCode-win32-x64'),
            (Join-Path $env:GITHUB_WORKSPACE 'VSCode-win32-x64')
          )
          $package = $candidates | Where-Object {
            (Test-Path $_ -PathType Container) -and
            (Test-Path (Join-Path $_ 'VSCodium.exe') -PathType Leaf)
          } | Select-Object -First 1
          if (-not $package) {
            Write-Host 'Potential executables:'
            Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE '..') -Filter 'VSCodium.exe' -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 20 -ExpandProperty FullName
            throw 'Cannot find packaged VSCodium.exe; inspect the upstream packaging output.'
          }
          $package = (Resolve-Path $package).Path
          "path=$package" >> $env:GITHUB_OUTPUT
          Write-Host "Packaged application: $package"

      - name: Upload Windows x64 application
        uses: actions/upload-artifact@v4
        with:
          name: VSCodium-Windows-x64-AVX2-Selective-${{ matrix.variant }}
          path: ${{ steps.package.outputs.path }}/
          if-no-files-found: error
          retention-days: 14
